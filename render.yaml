services:
  - type: web
    name: verdant-cart
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verdant-cart-db
          property: connectionString
      - key: JWT_SECRET
        value: replace-with-strong-secret
      - key: ADMIN_EMAIL
        value: admin@verdant.local
      - key: ADMIN_PASSWORD
        value: ChangeMe123!

databases:
  - name: verdant-cart-db
    plan: free
